# 说明：上游把 workflow 放在 pob-zh-engine/.github/workflows/ 子目录里，GitHub Actions 不认子目录，
# 所以 fork 里必须把它放到仓库根的 .github/workflows/，并把 source-dir 指到 pob-zh-engine。
# 这个文件的目的是在 fork 上产出带「国服」区域的 pob-zh.exe。

name: Build pob-zh (CN realm)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pob-zh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKG_TARGET_TRIPLET: x64-windows-release
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      INST_DIR: ${{ github.workspace }}/install-prefix
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Append short commit sha to CFG_VERSION_NUM
        shell: powershell
        run: |
          $file = 'pob-zh-engine\config.h'
          $short = (git rev-parse --short HEAD)
          (Get-Content $file -Raw) -replace '(#define\s+CFG_VERSION_NUM\s+"[^"]*)(")', "`$1-$short`$2" | Set-Content $file -Encoding utf8

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "./pob-zh-engine/vcpkg.json"
          runVcpkgInstall: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Obtain and run CMake
        uses: threeal/cmake-action@v1.3.0
        with:
          source-dir: "pob-zh-engine"
          build-dir: "build"
          generator: "Visual Studio 17 2022"
          options: CMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" CMAKE_INSTALL_PREFIX="${{ env.INST_DIR }}" VCPKG_TARGET_TRIPLET="${{ env.VCPKG_TARGET_TRIPLET }}"

      - name: Build and install
        run: cmake --build build --config Release -t INSTALL

      - name: Show install output
        shell: powershell
        run: |
          Get-ChildItem "$env:INST_DIR" -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload pob-zh exe and engine DLLs
        uses: actions/upload-artifact@v4
        with:
          name: pob-zh-CN-x64
          if-no-files-found: error
          path: |
            ${{ env.INST_DIR }}/pob-zh.exe
            ${{ env.INST_DIR }}/*.dll
